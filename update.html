<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>配置修改</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --card-press: #e5e5ea;
    --text: #000000;
    --text-2: #8e8e93;
    --text-3: #c7c7cc;
    --sep: rgba(60,60,67,.13);
    --blue: #007aff;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --fill: #e9e9eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --card-press: #2c2c2e;
      --text: #ffffff;
      --text-2: #8e8e93;
      --text-3: #48484a;
      --sep: rgba(84,84,88,.65);
      --blue: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --fill: #2c2c2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
    -webkit-font-smoothing: antialiased;
    font-size: 17px;
    line-height: 1.4;
    transition: background .3s, color .3s;
  }

  /* 顶部进度条 */
  #bar {
    position: fixed; top: 0; left: 0; height: 2.5px; width: 0;
    background: var(--blue);
    z-index: 100;
    transition: width .3s ease, background .3s, opacity .3s;
    border-radius: 0 2px 2px 0;
  }
  #bar.done { background: var(--green); }
  #bar.fail { background: var(--red); }

  .wrap { max-width: 540px; margin: 0 auto; padding: 0 16px; }

  /* 大标题 */
  header {
    padding: 12px 4px 20px;
    animation: fadeIn .4s ease both;
  }
  header h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.8px;
    margin: 0 0 2px;
    line-height: 1.15;
  }
  header p {
    margin: 0;
    font-size: 15px;
    color: var(--text-2);
    letter-spacing: -0.2px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 分组小标题 */
  .section-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 24px 16px 8px;
    margin: 0;
  }
  .wrap .section-title { padding-left: 4px; padding-right: 4px; }

  /* 分组卡片 */
  .group {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    animation: cardIn .45s cubic-bezier(.25,.8,.3,1) both;
  }
  .group:nth-of-type(1) { animation-delay: .05s; }
  .group:nth-of-type(2) { animation-delay: .1s; }
  .group:nth-of-type(3) { animation-delay: .15s; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 行 */
  .row {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 11px 16px;
    position: relative;
    gap: 12px;
  }
  .row + .row::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 0;
    height: 0.5px;
    background: var(--sep);
    transform: scaleY(0.5);
  }
  .row-label {
    flex-shrink: 0;
    font-size: 17px;
    color: var(--text);
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .row-icon {
    width: 29px; height: 29px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .icon-pw { background: linear-gradient(180deg, #a78bfa, #8b5cf6); color: #fff; }
  .icon-port { background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #fff; }

  .row-value {
    flex: 1;
    min-width: 0;
  }
  .row-value input {
    width: 100%;
    padding: 0;
    font-size: 17px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    text-align: right;
    -webkit-appearance: none;
  }
  .row-value input::placeholder { color: var(--text-3); }

  .tag {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-2);
    letter-spacing: -0.1px;
    flex-shrink: 0;
    margin-right: 2px;
  }

  /* 端口步进器 */
  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .step-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--fill);
    color: var(--blue);
    font-size: 20px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, background .15s, opacity .15s;
    user-select: none; -webkit-user-select: none;
    padding: 0;
    padding-bottom: 2px;
  }
  .step-btn:active { transform: scale(.88); opacity: .6; }

  /* 连接状态 */
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-3);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .status-dot.online {
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(52,199,89,.15);
    animation: dotPulse 2s ease-in-out infinite;
  }
  .status-dot.connecting {
    background: var(--orange);
    animation: dotBlink .8s ease-in-out infinite;
  }
  .status-dot.offline {
    background: var(--red);
    box-shadow: 0 0 0 4px rgba(255,59,48,.12);
  }
  @keyframes dotPulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(52,199,89,.15); }
    50% { box-shadow: 0 0 0 8px rgba(52,199,89,.06); }
  }
  @keyframes dotBlink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .status-text {
    font-size: 17px;
    letter-spacing: -0.2px;
    transition: color .3s;
  }
  .status-text.online { color: var(--text); }
  .status-text.connecting { color: var(--orange); }
  .status-text.offline { color: var(--red); }

  .status-detail {
    font-size: 13px;
    color: var(--text-2);
    margin-top: 2px;
    letter-spacing: -0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-detail:empty { display: none; }

  .chevron {
    color: var(--text-3);
    font-size: 18px;
    flex-shrink: 0;
    transition: color .2s, opacity .2s;
  }
  .row.tappable { cursor: pointer; transition: background .1s; }
  .row.tappable:active { background: var(--card-press); }
  .row.tappable:active .chevron { color: var(--text-2); }

  /* 预览 */
  .preview {
    padding: 14px 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-2);
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .preview::-webkit-scrollbar { display: none; }
  .preview .key { color: #af52de; }
  .preview .val { color: var(--blue); font-weight: 500; }
  .preview .cmt { color: var(--text-3); }

  /* 保存按钮 */
  .save-wrap { margin-top: 32px; }
  .save-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    font-family: inherit;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .12s, background .2s, opacity .2s;
  }
  .save-btn:active:not(:disabled) { transform: scale(.975); opacity: .85; }
  .save-btn:disabled { opacity: .5; cursor: not-allowed; }
  .save-btn.success { background: var(--green); }
  .save-btn.error { background: var(--red); }

  .spinner {
    width: 17px; height: 17px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .save-btn.loading .spinner { display: block; }
  .save-btn.loading .btn-icon { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--card);
    font-size: 14px;
    line-height: 1.5;
    display: none;
    animation: cardIn .3s ease both;
    letter-spacing: -0.1px;
    color: var(--text);
  }
  .toast.show { display: block; }
  .toast.ok { color: var(--green); }
  .toast.err { color: var(--red); }
  .toast b {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* 底部 */
  footer {
    text-align: center;
    margin-top: 32px;
    padding-bottom: 8px;
  }
  footer button {
    background: none;
    border: none;
    color: var(--blue);
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    padding: 10px 16px;
    letter-spacing: -0.2px;
    transition: opacity .15s;
  }
  footer button:active { opacity: .5; }
  footer button.danger { color: var(--red); }
</style>
</head>
<body>
<div id="bar"></div>

<div class="wrap">
  <header>
    <h1>配置修改</h1>
    <p>修改 Mihomo 节点参数</p>
  </header>

  <!-- 连接状态 -->
  <p class="section-title">连接</p>
  <div class="group">
    <div class="row tappable" id="statusRow">
      <div class="status-dot" id="statusDot"></div>
      <div class="row-value">
        <div class="status-text" id="statusText">未连接</div>
        <div class="status-detail" id="statusDetail">点此输入 GitHub Token</div>
      </div>
      <div class="chevron" id="statusChevron">›</div>
    </div>
  </div>

  <!-- 节点参数 -->
  <p class="section-title">节点参数</p>
  <div class="group">
    <div class="row">
      <div class="row-label">
        <div class="row-icon icon-pw">🔑</div>
        密码
      </div>
      <div class="row-value">
        <input id="password" type="text" inputmode="numeric" placeholder="健康" autocomplete="off" spellcheck="false">
      </div>
      <span class="tag">#1</span>
    </div>
    <div class="row">
      <div class="row-label">
        <div class="row-icon icon-port">⚡</div>
        端口
      </div>
      <div class="row-value">
        <input id="port" type="text" inputmode="numeric" placeholder=" 幸运" autocomplete="off" spellcheck="false" style="text-align:right">
      </div>
      <div class="stepper">
        <button class="step-btn" id="minus" aria-label="减小">−</button>
        <button class="step-btn" id="plus" aria-label="增大">+</button>
      </div>
    </div>
  </div>

  <!-- 预览 -->
  <p class="section-title">预览</p>
  <div class="group">
    <div class="preview">
      <div>  - cipher: aes-256-gcm</div>
      <div>    name: City of Hearts | US</div>
      <div>    <span class="key">password</span>: "<span class="val" id="previewPw">健康</span>" <span class="cmt">#匹配1</span></div>
      <div>    <span class="key">port</span>: <span class="val" id="previewPort"> 幸运</span> <span class="cmt">#匹配2</span></div>
      <div>    server: 146.190.157.232</div>
    </div>
  </div>

  <!-- 保存 -->
  <div class="save-wrap">
    <button class="save-btn" id="submit">
      <span class="spinner"></span>
      <span class="btn-icon" id="btnIcon"></span>
      <span id="btnText">保存到 Gist</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    <button id="resetToken" class="danger">清除 Token</button>
  </footer>
</div>

<script>
// ============ 配置区 ============
const GIST_ID   = '1e6828fa03816d280643b4be5d624000';
const FILE_NAME = 'Mihomo.yaml';
// ================================

const $ = (id) => document.getElementById(id);
const bar = $('bar'), toast = $('toast'), btn = $('submit'),
      btnText = $('btnText'), pwInput = $('password'), portInput = $('port'),
      prevPw = $('previewPw'), prevPort = $('previewPort'),
      statusRow = $('statusRow'), statusDot = $('statusDot'),
      statusText = $('statusText'), statusDetail = $('statusDetail'),
      statusChevron = $('statusChevron');

let token = localStorage.getItem('gh_token');
let connected = false;

// —— 状态 ——
function setStatus(state, label, detail) {
  statusDot.className = 'status-dot ' + state;
  statusText.className = 'status-text ' + state;
  statusText.textContent = label;
  statusDetail.textContent = detail || '';
  // 已连接时隐藏箭头，其他状态显示
  statusChevron.style.opacity = (state === 'online') ? '0' : '1';
}

// —— 预览同步 ——
function syncPreview() {
  prevPw.textContent   = pwInput.value   || '…';
  prevPort.textContent = portInput.value || '…';
}
pwInput.addEventListener('input', syncPreview);
portInput.addEventListener('input', syncPreview);

// —— 输入框：聚焦时清空（方便直接输新值）——
[pwInput, portInput].forEach((el) => {
  el.addEventListener('focus', () => {
    if (el.value) {
      el.value = '';
      syncPreview();
    }
  });
});

// —— 进度条 / Toast ——
function setBar(pct, cls) {
  bar.style.width = pct + '%';
  bar.className = cls || '';
  if (cls === 'done' || cls === 'fail') {
    setTimeout(() => {
      bar.style.opacity = '0';
      setTimeout(() => { bar.style.width = '0'; bar.style.opacity = '1'; }, 300);
    }, 800);
  }
}
function showToast(html, ok) {
  toast.innerHTML = html;
  toast.className = 'toast show ' + (ok ? 'ok' : 'err');
}

// —— 连接验证 ——
async function verifyConnection() {
  if (!token) {
    connected = false;
    setStatus('', '未连接', '点此输入 GitHub Token');
    return false;
  }
  setStatus('connecting', '连接中…', '正在验证 Token 与 Gist');
  setBar(30);
  try {
    const userRes = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!userRes.ok) throw new Error('Token 无效或已过期');
    const user = await userRes.json();

    const gistRes = await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!gistRes.ok) throw new Error('无法访问 Gist');
    const gist = await gistRes.json();
    const file = gist.files[FILE_NAME];
    if (!file) throw new Error('找不到文件 ' + FILE_NAME);

    const pwMatch   = file.content.match(/password:\s*"?([^"\n]*)"?\s*#匹配1/);
    const portMatch = file.content.match(/port:\s*(\d+)\s*#匹配2/);
    if (pwMatch)   pwInput.value   = pwMatch[1].trim();
    if (portMatch) portInput.value = portMatch[1];
    syncPreview();

    connected = true;
    setStatus('online', '已连接', '');
    setBar(100, 'done');
    return true;
  } catch (e) {
    connected = false;
    setStatus('offline', '连接失败', e.message + ' · 点此重试');
    setBar(100, 'fail');
    return false;
  }
}

// —— Token 输入 ——
function askToken() {
  const t = prompt('粘贴 GitHub Token（只存本机）：');
  if (t && t.trim()) {
    token = t.trim();
    localStorage.setItem('gh_token', token);
    verifyConnection();
  }
}

// —— 状态行点击 ——
statusRow.onclick = () => {
  if (!token) askToken();
  else if (!connected) verifyConnection();
  else if (confirm('重新验证连接？')) verifyConnection();
};

// —— 清除 Token ——
$('resetToken').onclick = () => {
  if (confirm('确定清除本机保存的 Token？')) {
    localStorage.removeItem('gh_token');
    token = null;
    connected = false;
    location.reload();
  }
};

// —— 端口步进器 ——
function bindStepper(el, delta) {
  let t1 = null, t2 = null;
  const start = (e) => {
    e.preventDefault();
    step(delta);
    t1 = setTimeout(() => { t2 = setInterval(() => step(delta), 80); }, 450);
  };
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('mousedown', start);
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, stop));
}
function step(delta) {
  let v = parseInt(portInput.value || '0', 10);
  if (isNaN(v)) v = 0;
  v = Math.min(65535, Math.max(1, v + delta));
  portInput.value = v;
  syncPreview();
  if (navigator.vibrate) navigator.vibrate(6);
}
bindStepper($('minus'), -1);
bindStepper($('plus'), 1);

// —— 保存 ——
btn.onclick = async () => {
  if (!connected) {
    showToast('请先连接 Gist。', false);
    verifyConnection();
    return;
  }
  const newPassword = pwInput.value.trim();
  const newPort = portInput.value.trim();

  if (!newPassword) return showToast('密码不能为空。', false);
  if (!/^\d+$/.test(newPort)) return showToast('端口必须是数字。', false);
  const portNum = parseInt(newPort, 10);
  if (portNum < 1 || portNum > 65535) return showToast('端口范围 1–65535。', false);

  btn.disabled = true;
  btn.classList.remove('success','error');
  btn.classList.add('loading');
  btnText.textContent = '保存中…';
  toast.className = 'toast';
  setBar(20);

  try {
    const getRes = await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!getRes.ok) throw new Error('读取失败 HTTP ' + getRes.status);
    setBar(50);
    const gist = await getRes.json();
    const file = gist.files[FILE_NAME];
    if (!file) throw new Error('文件不存在：' + FILE_NAME);
    let content = file.content;

    const pwRe = /(password:\s*"?)[^"\n]*("?\s*#匹配1)/;
    if (!pwRe.test(content)) throw new Error('未找到 #匹配1 对应的 password');
    content = content.replace(pwRe, `$1${newPassword}$2`);

    const portRe = /(port:\s*)\d+(\s*#匹配2)/;
    if (!portRe.test(content)) throw new Error('未找到 #匹配2 对应的 port');
    content = content.replace(portRe, `$1${newPort}$2`);

    setBar(70);

    const patchRes = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ files: { [FILE_NAME]: { content } } })
    });
    if (!patchRes.ok) throw new Error('保存失败 HTTP ' + patchRes.status);

    setBar(100, 'done');
    btn.classList.remove('loading');
    btn.classList.add('success');
    btnText.textContent = '已保存';
    showToast(`密码 <b>${newPassword}</b> · 端口 <b>${newPort}</b> 已更新`, true);
    if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
    setTimeout(() => {
      btn.classList.remove('success');
      btnText.textContent = '保存到 Gist';
    }, 2000);
  } catch (e) {
    setBar(100, 'fail');
    btn.classList.remove('loading');
    btn.classList.add('error');
    btnText.textContent = '保存失败';
    showToast('保存失败：' + e.message, false);
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    setTimeout(() => {
      btn.classList.remove('error');
      btnText.textContent = '保存到 Gist';
    }, 2000);
  } finally {
    btn.disabled = false;
  }
};

// —— 启动 ——
if (token) verifyConnection();
else setStatus('', '未连接', '点此输入 GitHub Token');
</script>
</body>
</html>
